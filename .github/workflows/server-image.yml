name: Build server image

# Publishes a multi-architecture image to GHCR so the NAS can pull a prebuilt
# server instead of compiling one. Authentication uses the built-in GITHUB_TOKEN;
# there is no secret to configure.

on:
  push:
    branches: [main]
    # Only rebuild when the server actually changes — the iOS app shares this repo
    # but contributes nothing to the image.
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mediavault-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. pillow-heif has no wheel on 3.14 yet.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: server
        # ffmpeg is preinstalled on ubuntu-latest, so the video thumbnail tests
        # run here rather than skipping.
        run: pytest -q

  build:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed to build the arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          # The build context is server/, so nothing from app/ enters the image.
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub as well, because some NAS container UIs will only pull from
      # the official registry. Skipped entirely until the secrets are set, so the
      # workflow keeps working without them.
      - name: Is Docker Hub configured?
        id: hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$HUB_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME not set — skipping Docker Hub." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive Docker Hub tags
        id: hubmeta
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mediavault-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Push to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.hubmeta.outputs.tags }}
          labels: ${{ steps.hubmeta.outputs.labels }}
          # Same cache as the GHCR build above, so this re-tags rather than
          # rebuilding — it costs seconds, not another emulated arm64 compile.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "docker pull ${{ env.IMAGE_NAME }}:latest"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mediavault-server:latest"
            fi
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
